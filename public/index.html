<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================
       CHARACTER ENCODING & COMPATIBILITY
  ============================================ 
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- ============================================
       RESPONSIVE VIEWPORT - CRITICAL FOR MOBILE
  ============================================ 
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover"
  />
  
  <!-- ============================================
       PWA & MOBILE APP META TAGS
  ============================================ 
  <meta name="theme-color" content="#667eea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bambeh" />
  
  <!-- ============================================
       SEO & DESCRIPTION
  ============================================ 
  <meta name="description" content="Bambeh - Africa's Premier Marketplace. Buy, sell, and discover everything you need." />
  <meta name="keywords" content="marketplace, shopping, Cameroon, Africa, buy, sell, Bambé" />
  <meta name="author" content="ETS BUSHENERGY" />
  
  <!-- ============================================
       FAVICON & APP ICONS
  ============================================ 
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <!-- ============================================
       PRECONNECT TO EXTERNAL SERVICES (Performance)
  ============================================ 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
  
  <!-- ============================================
       CONTENT SECURITY POLICY
  ============================================ 
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data: https: blob: http://localhost:*;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firebasestorage.googleapis.com wss://*.firebaseio.com http://localhost:*;
    frame-src 'self' https://www.google.com https://*.firebaseapp.com;
    media-src 'self' blob: https: data:;
    worker-src 'self' blob:;
  ">
  
  <!-- ============================================
       PAGE TITLE
  ============================================ 
  <title>Bambeh - Africa's Premier Marketplace</title>
  
  <!-- ============================================
       PREVENT UNWANTED ZOOM ON IOS (But Allow Accessibility Zoom)
  ============================================ 
  <style>
    /* Prevent auto-zoom on input focus for iOS */
    @supports (-webkit-touch-callout: none) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    
    /* Loading spinner while React loads */
    #root-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }
    
    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Hide loader once React mounts */
    #root:not(:empty) ~ #root-loader {
      display: none;
    }
  </style>
</head>

<body>
  <!-- ============================================
       NO JAVASCRIPT FALLBACK
  ============================================ 
  <noscript>
    <div style="
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    ">
      <div>
        <h1>⚠️ JavaScript Required</h1>
        <p style="margin-top: 20px; font-size: 18px;">
          Bambé requires JavaScript to run.<br>
          Please enable JavaScript in your browser settings.
        </p>
      </div>
    </div>
  </noscript>
  
  <!-- ============================================
       REACT ROOT CONTAINER
  ============================================ 
  <div id="root"></div>
  
  <!-- ============================================
       LOADING SPINNER (Shows while React loads)
  ============================================ 
  <div id="root-loader">
    <div class="loader-spinner"></div>
  </div>
  
  <!-- ============================================
       CAPACITOR SCRIPTS (For Mobile App)
  ============================================ 
  <script src="cordova.js"></script>
  
</body>
</html>
