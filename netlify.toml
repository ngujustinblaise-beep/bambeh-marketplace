
================================================================
[build]
  command = "npm run build"
  publish = "dist"
 
# ── Redirect all routes to index.html (required for React SPA) ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
 
# ── Security headers for ALL pages ──
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 1 year — tells browsers NEVER use HTTP
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
 
    # Prevent clickjacking (nobody can put your site in an iframe)
    X-Frame-Options = "DENY"
 
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
 
    # Legacy XSS filter for old browsers
    X-XSS-Protection = "1; mode=block"
 
    # Control what referrer info is sent
    Referrer-Policy = "strict-origin-when-cross-origin"
 
    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
 
    # Content Security Policy
    # FIX APPLIED: wss://*.supabase.co already present (keeps Supabase realtime working)
    # ADDED: wss://bambeh-backend-production.up.railway.app for your backend WebSockets
    # ADDED: https://*.campay.net for CamPay payment integration
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://bambeh-backend-production.up.railway.app wss://bambeh-backend-production.up.railway.app https://bambeh-payment-server.onrender.com https://api.notchpay.co https://api.anthropic.com https://*.campay.net https://*.sentry.io https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://fcm.googleapis.com https://firebaseinstallations.googleapis.com https://identitytoolkit.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://*.supabase.co; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none';"
 
# ── Cache: translation files must always be fresh ──
[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
 
# ── Cache: built assets are immutable (hashed filenames) ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
================================================================
 
